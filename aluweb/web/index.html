<!DOCTYPE html>
<html>
<head>
  <!-- ضع هذا السطر الحرفي والذكي هنا كما هو تماماً -->
  <base href="$FLUTTER_BASE_HREF"> 
  
  <meta charset="UTF-8">
  <title>aluweb</title>
  <link rel="manifest" href="manifest.json">
</head>

<body>
  <div id="loading">
  <style>
    .spinner {
      border: 4px solid #f3f3f3;
      border-top: 4px solid #3498db;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 20% auto;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
  <div class="spinner"></div>
  <p style="text-align: center; font-family: sans-serif;">جاري تحميل معرض الأعمال...</p>
</div>

  <script src="flutter_bootstrap.js" async></script>
  <script>
  window.addEventListener('flutter-first-frame', function() {
    document.title = "aluweb-admin";
  });
</script>
</body>
</html>
